<div class="col-lg-3">
                <h1 class="h2 pb-4">دسته بندی</h1>
                <ul class="list-unstyled templatemo-accordion padd-r-0">
                    {% for cat in main_category %}
                    {% if cat.articlecathegory_set.all %}
                    <li class="pb-3">
                        <a class="collapsed d-flex justify-content-between h3 text-decoration-none" href="{{ cat.url_title }}">
                            {{ cat.title }}
                            <i class="fa fa-fw fa-chevron-circle-down mt-1"></i>
                        </a>

                        <ul class="collapse show list-unstyled pl-3">
                        {% for sub_cast  in cat.articlecathegory_set.all %}
                            <li><a class="text-decoration-none" href="{% url 'articles_by_category_list' category_name=cat.url_title %}">{{ sub_cast.title }}</a></li>
                        {% endfor %}
                        </ul>

                    </li>
                    {% else %}
                        <li class="pb-3">
                        <a class="collapsed d-flex justify-content-between h3 text-decoration-none" href="{% url 'articles_by_category_list' category_name=cat.url_title %}">
                            {{ cat.title }}
                            <i class="fa fa-fw fa-chevron-circle-down mt-1"></i>
                        </a>
                        </li>
                    {% endif %}
                    {% endfor %}
                </ul>
            </div>
