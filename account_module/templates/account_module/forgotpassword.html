{% extends 'shared/_layout.html' %}
{% block title %}
    فراموشی کلمه عبور
{% endblock %}
{% block content %}
  <div class="container py-5">
        <div class="row py-5">
            <form class="col-sm-6 col-md-offset-3" method="post" role="form" action="{% url 'forget-password' %}">
                {% csrf_token %}
                {{ forget_pass_form.email.label_tag }}
                {{ forget_pass_form.email }}
                {{ forget_pass_form.email.error }}

                <div class="row">
                    <div class="col text-end mt-2">
                        <button type="submit" class="btn btn-success btn-lg px-3">تایید</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
