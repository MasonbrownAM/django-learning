{% extends 'shared/_layout.html' %}
{% block title %}
   بازیابی رمز عبور
{% endblock %}
{% block content %}
  <div class="container py-5">
        <div class="row py-5">
            <form class="col-sm-6 col-md-offset-3" method="post" role="form" action="{% url 'reset-password' active_code %}">
                {% csrf_token %}
                <p>مرز</p>
                {{ reset_password_form.password }}
                <p>تکرار رمز</p>
                {{ reset_password_form.password_confirm }}
                {{ reset_password_form.password_confirm.errors }}
                <div class="row">
                    <div class="col text-end mt-2">
                        <button type="submit" class="btn btn-success btn-lg px-3">تایید</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
